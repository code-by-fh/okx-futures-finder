name: docker-build-and-push

on:
  push:
    branches: ['main']
    tags: ['*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Unit and integration tests
        run: python -m unittest discover -v
      - name: JavaScript syntax
        run: node --check dashboard.js

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Determine image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DOCKERHUB_IMAGE" =~ ^[a-z0-9][a-z0-9_.-]*/[a-z0-9][a-z0-9_.-]*$ ]]; then
            echo 'Set repository variable DOCKERHUB_IMAGE to namespace/repository (without tag).' >&2
            exit 1
          fi
          tag="sha-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tag=latest
          fi
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'Git tag is not a valid Docker tag.' >&2
            exit 1
          fi
          {
            echo 'tags<<EOF'
            echo "$DOCKERHUB_IMAGE:$tag"
            if [[ "$tag" != "sha-${GITHUB_SHA:0:12}" ]]; then
              echo "$DOCKERHUB_IMAGE:sha-${GITHUB_SHA:0:12}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build local smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          tags: okx-futures-finder:smoke
          cache-from: type=gha,scope=finder
          cache-to: type=gha,mode=max,scope=finder
      - name: Container smoke test
        run: bash scripts/container-smoke.sh okx-futures-finder:smoke
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=finder
          cache-to: type=gha,mode=max,scope=finder
